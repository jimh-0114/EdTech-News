<body>
  <div id="root"></div>

  <script>
    // ── 資料來源：GAS 資料 API（JSONP）────────────────────────
    // 這個網頁放在 GitHub Pages，不在 google 網域上，所以沒有 google.script.run 可用，
    // 改用 <script src="API?callback=xxx"> 跨網域拿資料。
    // ⚠️ GAS 若「建立新部署」網址會變，要回來改這行；用「編輯現有部署 → 新增版本」就不用。
    const API_URL = "https://script.google.com/macros/s/AKfycbxPy_w_wA5MQTe4sn7TA4xbZZ96UbD0WsntORuN3RxkuMzAAi-i7JVrwjXUo6tQR3lPHg/exec";

    function jsonp(params, timeoutMs) {
      return new Promise((resolve, reject) => {
        const cb = "__cb" + Date.now() + Math.floor(Math.random() * 1e6);
        const qs = Object.entries(Object.assign({}, params, { callback: cb }))
          .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v == null ? "" : v))
          .join("&");
        const tag = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, timeoutMs || 60000);
        function cleanup() { clearTimeout(timer); delete window[cb]; tag.remove(); }
        window[cb] = (data) => { cleanup(); resolve(data); };
        tag.onerror = () => { cleanup(); reject(new Error("load error")); };
        tag.src = API_URL + "?" + qs;
        document.head.appendChild(tag);
      });
    }

    // ── 本機暫存：上次抓到的資料存在瀏覽器，再開網頁先秒顯示，背景再更新 ──
    // 存不進去（無痕視窗、空間滿）就當沒有，網頁照常從 GAS 抓。
    const CACHE_KEY = "edtechNews.v1";
    function readCache() {
      try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
    }
    function writeCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data })); } catch (e) {}
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const CATEGORIES = ["生產力工具", "政策與產業", "科技與教學", "學校現場"];
    const PAGE_SIZE = 80;
    // 四個分類各一個顏色＋圖示，卡片、分類鈕、統計、歷史列表都用同一套
    const CAT = {
      "生產力工具": { c: "#1F5F99", bg: "#E4EDF6", icon: "ph-wrench" },
      "政策與產業": { c: "#7A3E8E", bg: "#F0E6F3", icon: "ph-bank" },
      "科技與教學": { c: "#2F7D4F", bg: "#E3F0E7", icon: "ph-chalkboard-teacher" },
      "學校現場":   { c: "#B4560F", bg: "#F8EADC", icon: "ph-student" },
    };
    const catOf = (name) => CAT[name] || { c: "#1A1A1A", bg: "#F2EDE2", icon: "ph-newspaper" };

    function CatChip({ name, size }) {
      const k = catOf(name);
      return (
        <span className={`shrink-0 inline-flex items-center gap-1 font-black text-white ${size === "sm" ? "text-[11px] px-1.5 py-0.5" : "text-xs px-2 py-1"}`} style={{ background: k.c }}>
          <i className={`ph-fill ${k.icon}`}></i>{name}
        </span>
      );
    }
    const dateKey = (s) => new Date(String(s || "").replace(/\./g, '-')).getTime() || 0;
    const shortDate = (s) => String(s || "").slice(5);   // 2026.11.09 → 11.09

    // 搜尋字標黃
    function Highlight({ text, term }) {
      const t = String(text || "");
      if (!term) return t;
      const lower = t.toLowerCase();
      const q = term.toLowerCase();
      const parts = [];
      let i = 0, k = 0;
      while (true) {
        const j = lower.indexOf(q, i);
        if (j < 0) { parts.push(t.slice(i)); break; }
        parts.push(t.slice(i, j));
        parts.push(<mark key={k++}>{t.slice(j, j + q.length)}</mark>);
        i = j + q.length;
      }
      return <>{parts}</>;
    }

    function Score({ score }) {
      return (
        <span className={`mono text-xs font-bold inline-flex items-center gap-0.5 ${score >= 9 ? 'text-accent' : 'text-muted'}`}>
          <i className={`ph-fill ${score >= 9 ? 'ph-fire' : 'ph-star'} text-[13px]`}></i>{score}
        </span>
      );
    }

    // ── 骨架畫面元件 ──────────────────────────────────────────────
    function SkeletonScreen() {
      return (
        <div className="max-w-[1200px] mx-auto px-4 md:px-8 pb-16">
          <div className="pt-6 pb-4 flex flex-col items-center gap-3">
            <div className="skeleton h-3 w-40"></div>
            <div className="skeleton h-12 w-72 md:w-[28rem]"></div>
            <div className="skeleton h-3 w-56"></div>
          </div>
          <div className="double-rule mb-4"></div>
          <div className="flex justify-center gap-8 mb-6">
            <div className="skeleton h-5 w-24"></div>
            <div className="skeleton h-5 w-24"></div>
          </div>
          <div className="grid grid-cols-5 border-y border-ink py-4 mb-6 gap-4">
            {[...Array(5)].map((_, i) => (
              <div key={i} className="flex flex-col items-center gap-2">
                <div className="skeleton h-8 w-10"></div>
                <div className="skeleton h-3 w-14"></div>
              </div>
            ))}
          </div>
          <div className="border-t border-ink pt-6 flex flex-col gap-3">
            <div className="skeleton h-3 w-24"></div>
            <div className="skeleton h-8 w-3/4"></div>
            <div className="skeleton h-4 w-full"></div>
            <div className="skeleton h-4 w-2/3"></div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-x-10 mt-6">
            {[...Array(4)].map((_, i) => (
              <div key={i} className="border-t border-ink py-6 flex flex-col gap-3">
                <div className="skeleton h-3 w-20"></div>
                <div className="skeleton h-6 w-4/5"></div>
                <div className="skeleton h-4 w-full"></div>
                <div className="skeleton h-4 w-2/3"></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── 今日／最新情報：報紙式文章 ────────────────────────────────
    function NewsCard({ item, term, lead }) {
      const [open, setOpen] = useState(false);
      const summary = String(item["摘要"] || "");
      const long = summary.length > (lead ? 200 : 110);
      return (
        <article className={`bg-card border border-rule ${lead ? 'border-t-4' : 'border-t-2'} px-5 pt-4 pb-5 md:px-7 md:pt-5 md:pb-6 flex flex-col h-full shadow-[0_1px_0_rgba(26,26,26,0.06)] hover:shadow-[0_6px_18px_-8px_rgba(26,26,26,0.25)] transition-shadow`} style={{ borderTopColor: catOf(item["資訊類別"]).c }}>
          <div className="flex items-center justify-between gap-3 mb-2.5">
            <div className="flex items-center gap-2 min-w-0">
              <CatChip name={item["資訊類別"]} />
              {item.isRecommended && (
                <span className="shrink-0 text-[11px] font-black tracking-wider text-paper bg-accent px-1.5 py-0.5 inline-flex items-center gap-1">
                  <i className="ph-fill ph-crown"></i> 編輯精選
                </span>
              )}
            </div>
            <Score score={item.score} />
          </div>
          <h3 className={`serif font-black text-ink leading-snug mb-3 ${lead ? 'text-2xl md:text-[2.1rem] md:leading-tight' : 'text-xl md:text-[1.4rem]'}`}>
            <a href={item["超連結"]} target="_blank" rel="noopener noreferrer" className="hover:text-accent transition-colors">
              <Highlight text={item["標題"]} term={term} />
            </a>
          </h3>
          <p className={`text-[#3d3a35] leading-relaxed ${lead ? 'text-base md:text-[17px]' : 'text-[15px]'} ${open || !long ? '' : (lead ? 'line-clamp-4' : 'line-clamp-3')}`}>
            <Highlight text={summary} term={term} />
          </p>
          {long && (
            <button onClick={() => setOpen(!open)} className="self-start mt-1 text-xs font-bold text-muted hover:text-accent inline-flex items-center gap-1">
              {open ? '收合' : '看完整摘要'} <i className={`ph-bold ${open ? 'ph-caret-up' : 'ph-caret-down'}`}></i>
            </button>
          )}
          <div className="mt-auto pt-4 flex items-center justify-between gap-3 text-xs">
            <span className="text-muted font-bold truncate">
              {item["出處"] && <>{item["出處"]}<span className="mx-1.5 text-rule">|</span></>}
              <span className="mono">{item.displayDate}</span>
            </span>
            <a href={item["超連結"]} target="_blank" rel="noopener noreferrer" className="shrink-0 font-black text-ink hover:text-accent inline-flex items-center gap-1 border-b border-ink hover:border-accent pb-0.5 transition-colors">
              閱讀原文 <i className="ph-bold ph-arrow-up-right"></i>
            </a>
          </div>
        </article>
      );
    }

    // ── 戰略焦點「來源」：- 條列、**粗體**、網址自動變連結（2026-11-09）──
    function Inline({ text }) {
      const out = [];
      String(text).split(/(\*\*[^*]+\*\*|https?:\/\/[^\s）)」]+)/).forEach((p, i) => {
        if (!p) return;
        if (p.startsWith("**") && p.endsWith("**")) out.push(<strong key={i} className="font-black text-ink">{p.slice(2, -2)}</strong>);
        else if (/^https?:\/\//.test(p)) out.push(<a key={i} href={p} target="_blank" rel="noopener noreferrer" className="underline decoration-rule hover:text-accent break-all">{p}</a>);
        else out.push(p);
      });
      return <>{out}</>;
    }

    // 一段文字 → 區塊（段落、小標、條列、編號、表格）
    function parseBlocks(lines) {
      const blocks = [];
      let cur = null;
      const flush = () => { if (cur) blocks.push(cur); cur = null; };
      lines.forEach((raw) => {
        const line = raw.trim();
        if (!line) { flush(); return; }
        let m;
        if (line.startsWith("|")) {
          const cells = line.replace(/^\||\|$/g, "").split("|").map(s => s.trim());
          if (cells.every(s => /^:?-{2,}:?$/.test(s))) return;   // 表格分隔線
          if (!cur || cur.type !== "table") { flush(); cur = { type: "table", rows: [] }; }
          cur.rows.push(cells);
        } else if (/^\*\*[^*]+\*\*$/.test(line) || /^#{3,}\s/.test(line)) {
          flush(); blocks.push({ type: "h", text: line.replace(/^#+\s*/, "").replace(/^\*\*|\*\*$/g, "") });
        } else if ((m = line.match(/^(?:[-*]\s+|[•●・]\s*)(.*)$/))) {
          if (!cur || cur.type !== "ul") { flush(); cur = { type: "ul", items: [] }; }
          cur.items.push(m[1]);
        } else if ((m = line.match(/^\d+[.、]\s*(.*)$/)) && !/^\*\*.*\*\*$/.test(m[1])) {
          if (!cur || cur.type !== "ol") { flush(); cur = { type: "ol", items: [] }; }
          cur.items.push(m[1]);
        } else {
          if (!cur || cur.type !== "p") { flush(); cur = { type: "p", lines: [] }; }
          cur.lines.push(line);
        }
      });
      flush();
      return blocks;
    }

    function Blocks({ blocks }) {
      return blocks.map((b, i) => {
        if (b.type === "h") return <h5 key={i} className="serif text-lg md:text-xl font-black text-ink mt-5 mb-2 first:mt-0">{b.text}</h5>;
        if (b.type === "p") return <p key={i} className="mb-3 last:mb-0">{b.lines.map((l, j) => <React.Fragment key={j}>{j > 0 && <br />}<Inline text={l} /></React.Fragment>)}</p>;
        if (b.type === "ul") return <ul key={i} className="mb-3 last:mb-0 pl-5 list-disc marker:text-muted space-y-1.5">{b.items.map((t, j) => <li key={j}><Inline text={t} /></li>)}</ul>;
        if (b.type === "ol") return <ol key={i} className="mb-3 last:mb-0 pl-6 list-decimal marker:font-bold space-y-1.5">{b.items.map((t, j) => <li key={j}><Inline text={t} /></li>)}</ol>;
        if (b.type === "table") {
          const [head, ...rows] = b.rows;
          return (
            <div key={i} className="mb-3 last:mb-0 overflow-x-auto">
              <table className="w-full border-collapse bg-card text-[15px] md:text-base leading-relaxed">
                <thead><tr>{head.map((c, j) => <th key={j} className="border border-rule bg-paper2 px-3 py-2 text-left font-black whitespace-nowrap">{c}</th>)}</tr></thead>
                <tbody>{rows.map((r, j) => <tr key={j}>{head.map((_, k) => <td key={k} className="border border-rule px-3 py-2 align-top"><Inline text={r[k] || ""} /></td>)}</tr>)}</tbody>
              </table>
            </div>
          );
        }
        return null;
      });
    }

    // ── 主 App ────────────────────────────────────────────────────
    function App() {
      const [currentView, setCurrentView] = useState(location.hash === "#focus" ? "focus" : "data");
      const [searchTerm, setSearchTerm] = useState("");
      const [activeTab, setActiveTab] = useState("全部情報");
      const [newsData, setNewsData] = useState([]);
      const [focusHistory, setFocusHistory] = useState([]);
      const [selectedFocus, setSelectedFocus] = useState(null);   // 只用在「歷史戰略回顧」
      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [syncState, setSyncState] = useState("idle");         // idle｜syncing｜failed（有舊資料時才會用到）

      const [showToday, setShowToday] = useState(true);
      const [focusTab, setFocusTab] = useState("current");
      const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);

      const [viewStats, setViewStats] = useState({ today: 0, total: 0 });
      const [showAdmin, setShowAdmin] = useState(false);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [formData, setFormData] = useState({ title: '', link: '', reason: '' });
      const [toast, setToast] = useState(null);
      const [showTop, setShowTop] = useState(false);
      const searchRef = useRef(null);

      const now = new Date();
      const TODAY = now.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');
      const DATELINE = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

      const showToast = (msg, ok) => {
        setToast({ msg, ok });
        setTimeout(() => setToast(null), 3500);
      };

      const applyResult = (result) => {
        const formatted = (result.news || []).map(item => ({
          ...item,
          score: parseInt(item["推薦指數"]) || 0,
          displayDate: (item["執行日期"] || "").toString().replace(/-/g, '.'),
          isRecommended: ["是", "y", "v", "true", "1"].includes(String(item["版主推薦"] || "").toLowerCase().trim())
        }));
        setNewsData(formatted);

        const hist = (result.focus || []).map(d => ({
          title: d.標題,
          date: d.日期,
          videoUrl: d.影片網址,
          keyPoints: d.重點整理,
          sources: d.來源,
        })).reverse();
        setFocusHistory(hist);
        // 背景更新時，正在看的那篇歷史焦點不要被換掉
        setSelectedFocus(prev => prev ? (hist.find(h => h.title === prev.title && h.date === prev.date) || null) : null);

        if (result.views) setViewStats(result.views);
      };

      useEffect(() => {
        const cached = readCache();
        if (cached && cached.data) {
          applyResult(cached.data);
          setIsLoading(false);
          setSyncState("syncing");
        }
        jsonp({})
          .then((result) => {
            applyResult(result);
            writeCache(result);
            setIsLoading(false);
            setSyncState("idle");
          })
          .catch(() => {
            if (cached && cached.data) setSyncState("failed");
            else setLoadError(true);
            setIsLoading(false);
          });
      }, []);

      // 網址帶 #focus 直接開戰略焦點（信件按鈕可以連過來）
      useEffect(() => {
        const want = currentView === "focus" ? "#focus" : "";
        if (location.hash !== want) history.replaceState(null, "", location.pathname + location.search + want);
      }, [currentView]);

      useEffect(() => {
        const onScroll = () => setShowTop(window.scrollY > 700);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      // 投稿視窗：Esc 關閉、背景不捲動
      useEffect(() => {
        if (!isModalOpen) return;
        const onKey = (e) => { if (e.key === "Escape") setIsModalOpen(false); };
        document.addEventListener("keydown", onKey);
        document.body.style.overflow = "hidden";
        return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
      }, [isModalOpen]);

      // 換篩選條件就從頭顯示
      useEffect(() => { setVisibleCount(PAGE_SIZE); }, [searchTerm, activeTab, showToday]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        jsonp({ action: 'contribute', title: formData.title, link: formData.link, reason: formData.reason })
          .then((res) => {
            setIsSubmitting(false);
            if (res && res.success) {
              showToast('感謝分享！已送給版主審核。', true);
              setFormData({ title: '', link: '', reason: '' });
              setIsModalOpen(false);
            } else {
              showToast('送出失敗，請稍後再試或聯繫版主。', false);
            }
          })
          .catch(() => { setIsSubmitting(false); showToast('送出失敗，請稍後再試或聯繫版主。', false); });
      };

      // 今天還沒有資料（爬蟲還沒跑完）就顯示最近一天
      const hasToday = useMemo(() => newsData.some(i => i.displayDate === TODAY), [newsData, TODAY]);
      const viewDate = useMemo(() => {
        if (hasToday) return TODAY;
        let best = "", bestKey = 0;
        newsData.forEach(i => { const k = dateKey(i.displayDate); if (k > bestKey) { bestKey = k; best = i.displayDate; } });
        return best || TODAY;
      }, [newsData, hasToday, TODAY]);

      const dayData = useMemo(() => newsData.filter(i => i.displayDate === viewDate), [newsData, viewDate]);

      const stats = useMemo(() => ({
        total: dayData.length,
        tools: dayData.filter(i => i["資訊類別"] === "生產力工具").length,
        policy: dayData.filter(i => i["資訊類別"] === "政策與產業").length,
        teaching: dayData.filter(i => i["資訊類別"] === "科技與教學").length,
        school: dayData.filter(i => i["資訊類別"] === "學校現場").length,
      }), [dayData]);

      const term = searchTerm.trim();

      // 先套「日期＋搜尋」，分類按鈕上的數字就從這裡算
      const scoped = useMemo(() => {
        const q = term.toLowerCase();
        return newsData.filter(item => {
          if (showToday && item.displayDate !== viewDate) return false;
          if (!q) return true;
          return [item["標題"], item["摘要"], item["出處"]].some(v => String(v || "").toLowerCase().includes(q));
        });
      }, [newsData, showToday, viewDate, term]);

      const tabCounts = useMemo(() => {
        const c = { "全部情報": scoped.length };
        CATEGORIES.forEach(cat => { c[cat] = scoped.filter(i => i["資訊類別"] === cat).length; });
        return c;
      }, [scoped]);

      const filteredData = useMemo(() => {
        const result = scoped.filter(item => activeTab === "全部情報" || item["資訊類別"] === activeTab);
        result.sort((a, b) => {
          const dA = dateKey(a.displayDate), dB = dateKey(b.displayDate);
          // 「全部歷史」＝時間軸，純粹依日期新到舊；同一天才用分數決定先後
          if (!showToday) {
            if (dB !== dA) return dB - dA;
            return b.score - a.score;
          }
          // 「今日情報」：推薦 → 分數 → 日期
          if (a.isRecommended !== b.isRecommended) return a.isRecommended ? -1 : 1;
          if (b.score !== a.score) return b.score - a.score;
          return dB - dA;
        });
        return result;
      }, [scoped, activeTab, showToday]);

      const pickStat = (tab) => { setShowToday(true); setActiveTab(tab); };

      const openFocusView = () => {
        setCurrentView("focus");
        setFocusTab("current");
        setSelectedFocus(null);
        window.scrollTo({ top: 0 });
      };

      if (isLoading) return <SkeletonScreen />;

      if (loadError) return (
        <div className="max-w-[720px] mx-auto px-4 md:px-6 py-24 text-center">
          <div className="border-y-2 border-ink py-12">
            <i className="ph ph-plugs text-5xl text-muted mb-4 block"></i>
            <p className="serif text-2xl font-black mb-2">暫時連不上資料庫</p>
            <p className="text-sm text-muted font-bold mb-6">請稍後重新整理網頁，或聯繫版主。</p>
            <button onClick={() => location.reload()} className="bg-ink hover:bg-accent text-paper px-6 py-3 font-black transition-colors">重新整理</button>
          </div>
        </div>
      );

      const currentFocus = focusTab === "current" ? focusHistory[0] : selectedFocus;
      const shown = showToday ? filteredData : filteredData.slice(0, visibleCount);

      return (
        <div className="pb-20 animate-fade-in relative">
          {/* ── 報頭：獨立一條亮色橫帶，跟下面內容分開 ── */}
          <header className="bg-card border-b-2 border-ink shadow-[0_2px_10px_-4px_rgba(26,26,26,0.25)]">
           <div className="max-w-[1200px] mx-auto px-4 md:px-8 pt-4 md:pt-5">
            <div className="flex items-center justify-between gap-3 text-xs text-muted font-bold pb-3">
              <span className="flex items-center gap-2 min-w-0">
                <span className="truncate">{DATELINE}</span>
                {syncState === "syncing" && (
                  <span className="inline-flex items-center gap-1 shrink-0"><i className="ph-bold ph-arrows-clockwise animate-spin"></i> 更新中</span>
                )}
                {syncState === "failed" && (
                  <span className="inline-flex items-center gap-1 text-accent shrink-0" title="連不上資料庫，目前顯示上次的資料"><i className="ph-bold ph-warning-circle"></i> 顯示上次的資料</span>
                )}
              </span>
              <button
                onClick={() => setIsModalOpen(true)}
                className="shrink-0 inline-flex items-center gap-1.5 text-ink font-black border border-ink px-3 py-1.5 hover:bg-ink hover:text-paper transition-colors"
              >
                <i className="ph-bold ph-pencil-simple-line"></i> 我要投稿
              </button>
            </div>

            <div className="text-center pb-4 md:pb-5">
              <h1
                className="serif font-black text-ink text-[1.6rem] leading-tight sm:text-5xl md:text-6xl tracking-normal sm:tracking-[0.04em] whitespace-nowrap cursor-pointer select-none"
                onDoubleClick={() => setShowAdmin(!showAdmin)}
                title="數位部教育科技資訊報報"
              >
                數位部教育科技資訊報報
              </h1>
              <p className="mt-2 text-[10px] md:text-xs text-muted font-bold uppercase tracking-[0.16em] sm:tracking-[0.35em] whitespace-nowrap">Digital Education Intelligence Hub</p>
              {showAdmin && viewStats.total > 0 && (
                <div className="mt-2 flex justify-center items-center gap-3 text-[11px] font-bold text-muted mono animate-fade-in">
                  <span><i className="ph-bold ph-trend-up"></i> 今日觀看 {viewStats.today}</span>
                  <span><i className="ph-bold ph-eye"></i> 總觀看 {viewStats.total}</span>
                </div>
              )}
            </div>

            <div className="double-rule"></div>

            <nav className="flex justify-center gap-3 md:gap-4 py-4">
              {[
                { key: "data", label: "情報數據庫", icon: "ph-newspaper", go: () => setCurrentView("data") },
                { key: "focus", label: "戰略焦點", icon: "ph-monitor-play", go: openFocusView },
              ].map(n => (
                <button
                  key={n.key}
                  onClick={n.go}
                  className={`inline-flex items-center gap-2 px-5 md:px-8 py-2.5 md:py-3 text-base md:text-lg font-black border-2 border-ink transition-colors ${currentView === n.key ? 'bg-ink text-paper shadow-[3px_3px_0_#B91C1C]' : 'bg-card text-ink hover:bg-paper2'}`}
                >
                  <i className={`${currentView === n.key ? 'ph-fill' : 'ph-bold'} ${n.icon} text-xl`}></i>{n.label}
                </button>
              ))}
            </nav>
           </div>
          </header>

          <div className="max-w-[1200px] mx-auto px-4 md:px-8">
          <main className="pt-6 md:pt-8">
            {currentView === "data" && (
              <>
                {/* ── 今日統計：一列報紙式數字欄 ── */}
                <section className="grid grid-cols-5 bg-card border border-rule mb-5">
                  {[
                    { label: hasToday ? "今日新增" : `${shortDate(viewDate)} 新增`, tab: "全部情報", value: stats.total },
                    { label: "生產力工具", tab: "生產力工具", value: stats.tools },
                    { label: "政策與產業", tab: "政策與產業", value: stats.policy },
                    { label: "科技與教學", tab: "科技與教學", value: stats.teaching },
                    { label: "學校現場", tab: "學校現場", value: stats.school }
                  ].map((s, i) => {
                    const on = showToday && activeTab === s.tab;
                    const k = i === 0 ? { c: "#1A1A1A" } : catOf(s.tab);
                    return (
                      <button
                        key={i}
                        onClick={() => pickStat(s.tab)}
                        className={`py-3 md:py-4 px-1 text-center transition-colors hover:bg-paper2 border-t-4 ${i > 0 ? 'border-l border-l-rule' : ''} ${on ? 'bg-paper2' : ''}`}
                        style={{ borderTopColor: k.c }}
                      >
                        <span className="serif block font-black leading-none text-2xl md:text-4xl mb-1.5" style={{ color: k.c }}>{String(s.value).padStart(2, '0')}</span>
                        <span className={`block text-[10px] sm:text-[11px] md:text-[13px] font-bold sm:tracking-wide whitespace-nowrap ${on ? 'text-ink underline decoration-2 underline-offset-4' : 'text-muted'}`}>{s.label}</span>
                      </button>
                    );
                  })}
                </section>

                {/* ── 篩選列 ── */}
                <section className="bg-card border border-rule px-4 md:px-5 pt-1 md:sticky md:top-2 md:z-20 shadow-[0_4px_12px_-8px_rgba(26,26,26,0.3)]">
                  <div className="flex flex-col lg:flex-row lg:items-end gap-3 lg:gap-4">
                    <div className="flex items-end gap-5 shrink-0 border-b border-rule lg:border-b-0">
                      <button className={`tab-link py-2.5 ${showToday ? 'on' : ''}`} onClick={() => setShowToday(true)}>
                        {hasToday ? '今日情報' : '最新情報'}
                        <span className="mono text-[11px] font-black text-paper bg-ink px-1.5 py-px">+{dayData.length}</span>
                      </button>
                      <button className={`tab-link py-2.5 ${!showToday ? 'on' : ''}`} onClick={() => setShowToday(false)}>全部歷史</button>
                    </div>

                    <div className="hidden lg:block w-px h-6 bg-rule mb-3"></div>

                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar flex-1 min-w-0 items-center py-1 lg:pb-2.5">
                      {["全部情報", ...CATEGORIES].map(tab => {
                        const k = tab === "全部情報" ? { c: "#1A1A1A", bg: "#F2EDE2", icon: "ph-squares-four" } : catOf(tab);
                        const on = activeTab === tab;
                        return (
                          <button
                            key={tab}
                            onClick={() => setActiveTab(tab)}
                            className="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 text-sm font-black px-2.5 py-1.5 border-2 transition-colors"
                            style={on ? { background: k.c, borderColor: k.c, color: "#fff" } : { background: k.bg, borderColor: "transparent", color: k.c }}
                          >
                            <i className={`ph-fill ${k.icon}`}></i>{tab}
                            <span className="mono text-[11px] font-bold" style={{ opacity: on ? 0.85 : 0.7 }}>{tabCounts[tab]}</span>
                          </button>
                        );
                      })}
                    </div>

                    <div className="relative w-full lg:w-[190px] shrink-0 pb-2">
                      <i className="ph-bold ph-magnifying-glass absolute left-0 top-1/2 -translate-y-[60%] text-muted text-lg pointer-events-none"></i>
                      <input
                        ref={searchRef}
                        type="search"
                        placeholder="搜尋關鍵字" title="搜尋標題、摘要或出處"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="block w-full pl-7 pr-7 py-2 bg-transparent border-0 border-b border-rule focus:border-ink text-sm font-bold focus:outline-none placeholder-[#9a9184] transition-colors [&::-webkit-search-cancel-button]:hidden"
                      />
                      {searchTerm && (
                        <button
                          onClick={() => { setSearchTerm(""); searchRef.current && searchRef.current.focus(); }}
                          className="absolute right-0 top-1/2 -translate-y-[60%] text-muted hover:text-ink"
                          aria-label="清除搜尋"
                        >
                          <i className="ph-bold ph-x-circle text-lg"></i>
                        </button>
                      )}
                    </div>
                  </div>
                </section>

                {showToday && !hasToday && dayData.length > 0 && !term && (
                  <p className="text-sm font-bold text-muted py-3 flex items-center gap-2">
                    <i className="ph-bold ph-hourglass-medium text-accent"></i>
                    今天的情報還在整理中，先顯示 {viewDate} 的內容。
                  </p>
                )}

                {filteredData.length === 0 ? (
                  <div className="py-16 text-center">
                    <p className="serif text-2xl font-black mb-2">找不到符合條件的情報</p>
                    <p className="text-sm text-muted font-bold mb-6">換個關鍵字，或改看其他分類。</p>
                    <div className="flex flex-wrap justify-center gap-3">
                      {term && <button onClick={() => setSearchTerm("")} className="px-4 py-2 border border-ink text-sm font-black hover:bg-ink hover:text-paper transition-colors">清除搜尋</button>}
                      {activeTab !== "全部情報" && <button onClick={() => setActiveTab("全部情報")} className="px-4 py-2 border border-ink text-sm font-black hover:bg-ink hover:text-paper transition-colors">看全部分類</button>}
                      {showToday && <button onClick={() => setShowToday(false)} className="px-4 py-2 bg-ink text-paper text-sm font-black hover:bg-accent transition-colors">到全部歷史找</button>}
                    </div>
                  </div>
                ) : showToday ? (
                  /* ── 今日情報：每則一樣大，兩欄 ── */
                  <div className="pt-5 grid grid-cols-1 lg:grid-cols-2 gap-5 md:gap-6">
                    {filteredData.map((item, idx) => (
                      <NewsCard key={(item["超連結"] || "") + idx} item={item} term={term} />
                    ))}
                  </div>
                ) : (
                  /* ── 全部歷史：時間軸式精簡列表，整列可點，直接開原文 ── */
                  <div className="mt-5 bg-card border border-rule border-t-2 border-t-ink px-3 md:px-5 pb-3">
                    <div className="flex items-center gap-3 px-1 py-2 border-b border-ink text-[11px] font-black text-muted tracking-widest">
                      <span className="w-[44px] sm:w-[84px] shrink-0">日期</span>
                      <span className="w-[34px] sm:w-[40px] shrink-0 text-center">分數</span>
                      <span className="flex-1">標題</span>
                      <span className="mono shrink-0">{filteredData.length} 筆</span>
                    </div>

                    {shown.map((item, idx) => (
                      <a
                        key={(item["超連結"] || "") + idx}
                        href={item["超連結"]}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="row-item group"
                        title={item["標題"]}
                      >
                        <span className="text-xs font-semibold text-muted mono w-[44px] sm:w-[84px] shrink-0">
                          <span className="sm:hidden">{shortDate(item.displayDate)}</span>
                          <span className="hidden sm:inline">{item.displayDate}</span>
                        </span>
                        <span className="w-[34px] sm:w-[40px] shrink-0 text-center"><Score score={item.score} /></span>
                        <span className="flex-1 min-w-0 flex items-center gap-1.5">
                          {item.isRecommended && <i className="ph-fill ph-crown text-accent text-sm shrink-0" title="編輯精選"></i>}
                          <span className="line-clamp-2 sm:line-clamp-1 text-sm md:text-[15px] font-bold text-ink group-hover:text-accent transition-colors">
                            <Highlight text={item["標題"]} term={term} />
                          </span>
                        </span>
                        <span className="hidden md:inline-flex shrink-0 items-center gap-1 text-[11px] font-black px-1.5 py-0.5" style={{ background: catOf(item["資訊類別"]).bg, color: catOf(item["資訊類別"]).c }}><i className={`ph-fill ${catOf(item["資訊類別"]).icon}`}></i>{item["資訊類別"]}</span>
                        <i className="ph-bold ph-arrow-up-right text-base text-rule group-hover:text-accent transition-colors shrink-0"></i>
                      </a>
                    ))}

                    {filteredData.length > visibleCount && (
                      <button
                        onClick={() => setVisibleCount(visibleCount + PAGE_SIZE)}
                        className="w-full mt-2 py-3.5 border-y border-ink text-sm font-black text-ink hover:bg-ink hover:text-paper flex items-center justify-center gap-1.5 transition-colors"
                      >
                        再顯示 {Math.min(PAGE_SIZE, filteredData.length - visibleCount)} 筆
                        <span className="opacity-60 font-bold">（還有 {filteredData.length - visibleCount} 筆）</span>
                      </button>
                    )}
                  </div>
                )}
              </>
            )}

            {currentView === "focus" && (
              <div className="animate-fade-in">
                {focusHistory.length === 0 ? (
                  <div className="py-20 text-center">
                    <i className="ph ph-monitor-play text-5xl text-muted mb-4 block"></i>
                    <h3 className="serif text-2xl font-black mb-2">目前尚無已發布的戰略焦點</h3>
                    <p className="text-muted font-bold">請版主至 Google Sheet 將文章狀態標記為「已發布」</p>
                  </div>
                ) : (
                  <>
                    <div className="max-w-[1100px] mx-auto grid grid-cols-2 bg-card border border-rule p-1.5 gap-1.5 mb-5">
                      {[
                        { key: 'current', label: '當期核心戰略', icon: 'ph-lightning' },
                        { key: 'history', label: '歷史戰略回顧', icon: 'ph-clock-counter-clockwise', n: focusHistory.length },
                      ].map(t => (
                        <button
                          key={t.key}
                          onClick={() => { setFocusTab(t.key); setSelectedFocus(null); }}
                          className={`py-2.5 md:py-3 inline-flex items-center justify-center gap-2 text-[15px] md:text-base font-black transition-colors ${focusTab === t.key ? 'bg-ink text-paper' : 'text-muted hover:bg-paper2 hover:text-ink'}`}
                        >
                          <i className={`ph-fill ${t.icon}`}></i>{t.label}
                          {t.n != null && <span className="mono text-xs opacity-70">{t.n}</span>}
                        </button>
                      ))}
                    </div>

                    {currentFocus && (
                      <article className="max-w-[1100px] mx-auto bg-card border border-rule border-t-4 border-t-ink px-5 md:px-12 py-7 md:py-10 animate-fade-in">
                        {focusTab === 'history' && (
                          <button
                            onClick={() => setSelectedFocus(null)}
                            className="mb-6 inline-flex items-center gap-1.5 text-sm font-bold text-muted hover:text-accent"
                          >
                            <i className="ph-bold ph-arrow-left"></i> 返回歷史列表
                          </button>
                        )}
                        <div className="text-center mb-6">
                          <div className="flex justify-center items-center gap-2 mb-4">
                            <span className="inline-flex items-center gap-1 text-xs font-black text-white bg-accent px-2 py-1"><i className="ph-fill ph-lightning"></i>{focusTab === 'current' ? "當期核心戰略" : "歷史戰略回顧"}</span>
                            <span className="inline-flex items-center gap-1 text-xs font-bold mono text-ink bg-paper2 border border-rule px-2 py-1"><i className="ph-bold ph-calendar-blank"></i>{currentFocus.date}</span>
                          </div>
                          <h2 className="serif text-3xl md:text-[2.6rem] font-black text-ink leading-tight">{currentFocus.title}</h2>
                        </div>
                        <div className="double-rule mb-8"></div>

                        {/* 2026-11-09：不再用三個 W。左邊影片、右邊本集重點（約 300 字），下面來源 */}
                        <div className={`grid grid-cols-1 gap-6 md:gap-8 ${currentFocus.videoUrl ? 'lg:grid-cols-[3fr_2fr] lg:items-start' : ''}`}>
                          {currentFocus.videoUrl && (
                            <figure className="aspect-video w-full border border-ink p-1 bg-paper2">
                              <iframe
                                key={currentFocus.videoUrl}
                                className="w-full h-full"
                                src={currentFocus.videoUrl}
                                title={currentFocus.title}
                                loading="lazy"
                                frameBorder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowFullScreen
                              ></iframe>
                            </figure>
                          )}
                          {String(currentFocus.keyPoints || "").trim() && (
                            <section className="border-l-4 border-accent bg-paper2 px-5 md:px-6 py-4 md:py-5">
                              <p className="kicker mb-2">本集重點</p>
                              <p className="text-[16px] leading-[1.9] text-ink whitespace-pre-wrap">{currentFocus.keyPoints}</p>
                            </section>
                          )}
                        </div>
                        {String(currentFocus.sources || "").trim() && (
                          <div className="mt-8 pt-4 border-t border-rule text-sm text-muted leading-relaxed">
                            <p className="font-black text-ink mb-1.5"><i className="ph-bold ph-books"></i> 來源</p>
                            <Blocks blocks={parseBlocks(String(currentFocus.sources).split(/\r?\n/))} />
                          </div>
                        )}
                      </article>
                    )}

                    {focusTab === 'history' && !selectedFocus && (
                      <div className="max-w-[1100px] mx-auto">
                        <div className="flex items-baseline justify-between mb-3 px-1">
                          <h3 className="serif text-2xl font-black">歷史戰略檔案庫</h3>
                          <span className="text-sm text-muted font-bold">共 {focusHistory.length} 期</span>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {focusHistory.map((item, idx) => (
                            <button
                              key={idx}
                              onClick={() => { setSelectedFocus(item); window.scrollTo({ top: 0 }); }}
                              className="text-left flex gap-4 p-4 md:p-5 bg-card border border-rule border-t-4 border-t-ink hover:border-t-accent hover:shadow-[0_6px_18px_-8px_rgba(26,26,26,0.3)] transition-all group"
                            >
                              <span className="serif text-3xl font-black text-muted/40 group-hover:text-accent leading-none shrink-0 w-11 transition-colors">{String(focusHistory.length - idx).padStart(2, '0')}</span>
                              <span className="flex-1 min-w-0 flex flex-col">
                                <span className="serif text-lg font-bold text-ink leading-snug group-hover:text-accent transition-colors">{item.title}</span>
                                <span className="mt-auto pt-3 flex items-center justify-between text-xs">
                                  <span className="mono text-muted font-semibold"><i className="ph-bold ph-calendar-blank"></i> {item.date}</span>
                                  <span className="font-black text-ink group-hover:text-accent inline-flex items-center gap-1">觀看 <i className="ph-bold ph-arrow-right"></i></span>
                                </span>
                              </span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </main>

          <footer className="mt-16 pt-4 border-t-2 border-ink text-center text-xs text-muted font-bold tracking-wider">
            數位部教育科技資訊報報 · 每日更新
          </footer>
          </div>

          {showTop && (
            <button
              onClick={() => window.scrollTo({ top: 0 })}
              className="fixed bottom-5 right-5 z-40 w-11 h-11 bg-ink hover:bg-accent text-paper shadow-md flex items-center justify-center transition-colors animate-fade-in"
              aria-label="回到頂端"
            >
              <i className="ph-bold ph-arrow-up text-xl"></i>
            </button>
          )}

          {toast && (
            <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-[120] px-5 py-3 shadow-lg font-bold text-sm flex items-center gap-2 animate-fade-in text-paper ${toast.ok ? 'bg-ink' : 'bg-accent'}`}>
              <i className={`ph-fill ${toast.ok ? 'ph-check-circle' : 'ph-warning-circle'} text-lg`}></i> {toast.msg}
            </div>
          )}

          {isModalOpen && (
            <div
              className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay animate-fade-in"
              onClick={(e) => { if (e.target === e.currentTarget) setIsModalOpen(false); }}
            >
              <div className="bg-paper w-full max-w-lg max-h-[92vh] overflow-y-auto shadow-2xl border border-ink">
                <div className="px-6 md:px-8 pt-6 pb-4 flex justify-between items-start">
                  <div>
                    <p className="kicker mb-1">讀者投稿</p>
                    <h2 className="serif text-2xl font-black">我要推薦情報</h2>
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-muted hover:text-ink p-1" aria-label="關閉">
                    <i className="ph-bold ph-x text-2xl"></i>
                  </button>
                </div>
                <div className="double-rule mx-6 md:mx-8"></div>
                <form onSubmit={handleSubmit} className="px-6 md:px-8 py-6 space-y-5">
                  <div>
                    <label className="block text-sm font-black mb-1.5">文章標題 <span className="text-accent">*</span></label>
                    <input
                      required
                      autoFocus
                      value={formData.title}
                      onChange={e => setFormData({...formData, title: e.target.value})}
                      type="text"
                      placeholder="例如：台大教授揭開 AI 駕馭工程..."
                      className="w-full px-3 py-2.5 bg-white border border-rule focus:border-ink focus:outline-none font-medium transition-colors"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-black mb-1.5">超連結 URL <span className="text-accent">*</span></label>
                    <input
                      required
                      value={formData.link}
                      onChange={e => setFormData({...formData, link: e.target.value})}
                      type="url"
                      placeholder="https://..."
                      className="w-full px-3 py-2.5 bg-white border border-rule focus:border-ink focus:outline-none font-medium transition-colors"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-black mb-1.5">摘要內容</label>
                    <textarea
                      rows="3"
                      value={formData.reason}
                      onChange={e => setFormData({...formData, reason: e.target.value})}
                      placeholder="請簡單說明這篇文章為什麼值得讀者參考..."
                      className="w-full px-3 py-2.5 bg-white border border-rule focus:border-ink focus:outline-none font-medium transition-colors resize-none"
                    ></textarea>
                  </div>
                  <div className="pt-1">
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className={`w-full py-3.5 font-black text-base transition-colors flex justify-center items-center gap-2 ${isSubmitting ? 'bg-muted text-paper cursor-not-allowed' : 'bg-ink hover:bg-accent text-paper'}`}
                    >
                      {isSubmitting ? (
                        <><i className="ph-bold ph-spinner-gap animate-spin text-xl"></i> 傳送中...</>
                      ) : '確認送出推薦'}
                    </button>
                    <p className="text-center text-xs text-muted mt-3 font-bold">送出後將由版主人工審核後發布</p>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
