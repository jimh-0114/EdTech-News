<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script>
    // ── 資料來源：GAS 資料 API（JSONP）────────────────────────
    // 這個網頁放在 GitHub Pages，不在 google 網域上，所以沒有 google.script.run 可用，
    // 改用 <script src="API?callback=xxx"> 跨網域拿資料。
    // ⚠️ GAS 若「建立新部署」網址會變，要回來改這行；用「編輯現有部署 → 新增版本」就不用。
    const API_URL = "https://script.google.com/macros/s/AKfycbxPy_w_wA5MQTe4sn7TA4xbZZ96UbD0WsntORuN3RxkuMzAAi-i7JVrwjXUo6tQR3lPHg/exec";

    function jsonp(params, timeoutMs) {
      return new Promise((resolve, reject) => {
        const cb = "__cb" + Date.now() + Math.floor(Math.random() * 1e6);
        const qs = Object.entries(Object.assign({}, params, { callback: cb }))
          .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v == null ? "" : v))
          .join("&");
        const tag = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, timeoutMs || 60000);
        function cleanup() { clearTimeout(timer); delete window[cb]; tag.remove(); }
        window[cb] = (data) => { cleanup(); resolve(data); };
        tag.onerror = () => { cleanup(); reject(new Error("load error")); };
        tag.src = API_URL + "?" + qs;
        document.head.appendChild(tag);
      });
    }

    // ── 本機暫存：上次抓到的資料存在瀏覽器，再開網頁先秒顯示，背景再更新 ──
    // 存不進去（無痕視窗、空間滿）就當沒有，網頁照常從 GAS 抓。
    const CACHE_KEY = "edtechNews.v1";
    function readCache() {
      try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
    }
    function writeCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data })); } catch (e) {}
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const CATEGORIES = ["生產力工具", "政策與產業", "科技與教學", "學校現場"];
    const PAGE_SIZE = 80;
    const dateKey = (s) => new Date(String(s || "").replace(/\./g, '-')).getTime() || 0;
    const shortDate = (s) => String(s || "").slice(5);   // 2026.11.09 → 11.09

    // 搜尋字標黃
    function Highlight({ text, term }) {
      const t = String(text || "");
      if (!term) return t;
      const lower = t.toLowerCase();
      const q = term.toLowerCase();
      const parts = [];
      let i = 0, k = 0;
      while (true) {
        const j = lower.indexOf(q, i);
        if (j < 0) { parts.push(t.slice(i)); break; }
        parts.push(t.slice(i, j));
        parts.push(<mark key={k++}>{t.slice(j, j + q.length)}</mark>);
        i = j + q.length;
      }
      return <>{parts}</>;
    }

    // ── 骨架畫面元件 ──────────────────────────────────────────────
    function SkeletonScreen() {
      return (
        <div className="max-w-[1200px] mx-auto px-4 md:px-6 pb-16">
          <div className="py-5 md:py-6 flex justify-between items-center border-b border-slate-200 mb-6">
            <div className="flex items-center gap-3">
              <div className="skeleton w-12 h-12 rounded-xl"></div>
              <div className="flex flex-col gap-2">
                <div className="skeleton h-6 w-52"></div>
                <div className="skeleton h-3 w-36"></div>
              </div>
            </div>
            <div className="hidden md:flex gap-2">
              <div className="skeleton h-10 w-24 rounded-xl"></div>
              <div className="skeleton h-10 w-28 rounded-xl"></div>
              <div className="skeleton h-10 w-28 rounded-xl"></div>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4 mb-6">
            {[...Array(5)].map((_, i) => (
              <div key={i} className={`bg-white p-5 rounded-[1.5rem] border-2 border-slate-100 flex flex-col items-center gap-3 ${i === 0 ? 'col-span-2 lg:col-span-1' : ''}`}>
                <div className="skeleton h-10 w-12 rounded-lg"></div>
                <div className="skeleton h-3 w-20 rounded-md"></div>
              </div>
            ))}
          </div>

          <div className="bg-white p-4 rounded-[1.2rem] border-2 border-slate-100 mb-6 flex flex-wrap gap-3 items-center">
            <div className="skeleton h-10 w-40 rounded-xl"></div>
            <div className="flex gap-2">
              {[...Array(4)].map((_, i) => (
                <div key={i} className="skeleton h-8 w-20 rounded-lg"></div>
              ))}
            </div>
            <div className="skeleton h-10 w-64 rounded-lg ml-auto"></div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            {[...Array(4)].map((_, i) => (
              <div key={i} className="bg-white rounded-[1.5rem] p-6 border-2 border-slate-100 flex flex-col gap-4">
                <div className="flex gap-2">
                  <div className="skeleton h-6 w-16 rounded-md"></div>
                  <div className="skeleton h-6 w-20 rounded-md"></div>
                </div>
                <div className="skeleton h-6 w-4/5 rounded-md"></div>
                <div className="flex flex-col gap-2">
                  <div className="skeleton h-4 w-full rounded-md"></div>
                  <div className="skeleton h-4 w-full rounded-md"></div>
                  <div className="skeleton h-4 w-2/3 rounded-md"></div>
                </div>
                <div className="border-t border-slate-100 pt-4 flex justify-between items-center mt-auto">
                  <div className="skeleton h-4 w-24 rounded-md"></div>
                  <div className="skeleton h-4 w-20 rounded-md"></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── 今日／最新情報卡片 ────────────────────────────────────────
    function NewsCard({ item, term }) {
      const [open, setOpen] = useState(false);
      const summary = String(item["摘要"] || "");
      const long = summary.length > 110;
      return (
        <article className={`bg-white rounded-[1.5rem] p-5 md:p-6 border-2 shadow-sm hover:shadow-md transition-all flex flex-col justify-between relative overflow-hidden ${item.isRecommended ? 'border-amber-300' : 'border-slate-100 hover:border-blue-200'}`}>
          {item.isRecommended && (
            <div className="absolute top-0 right-0 bg-gradient-to-r from-amber-400 to-orange-500 text-white text-xs font-black px-3 py-1 rounded-bl-[1rem] flex items-center gap-1 shadow-sm">
              <i className="ph-fill ph-crown text-base"></i> 版主推薦
            </div>
          )}
          <div className="relative z-0">
            <div className={`flex justify-between items-start gap-2 mb-4 ${item.isRecommended ? 'pr-24' : ''}`}>
              <div className="flex flex-wrap gap-2">
                {item["出處"] && <span className="text-[11px] font-black px-2.5 py-1 bg-blue-50 text-blue-700 rounded-md uppercase border border-blue-100">{item["出處"]}</span>}
                <span className="text-[11px] font-black px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md uppercase">{item["資訊類別"]}</span>
              </div>
              {!item.isRecommended && (
                <span className={`shrink-0 text-xs font-black px-3 py-1 rounded-full flex items-center gap-1 ${item.score >= 9 ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-amber-50 text-amber-700 border border-amber-100'}`}>
                  <i className={`ph-fill ${item.score >= 9 ? 'ph-fire' : 'ph-star'} text-sm`}></i> {item.score} 分
                </span>
              )}
            </div>
            <h3 className="text-lg md:text-xl font-black mb-3 text-slate-900 leading-snug">
              <a href={item["超連結"]} target="_blank" rel="noopener noreferrer" className="hover:text-blue-700 transition-colors">
                <Highlight text={item["標題"]} term={term} />
              </a>
            </h3>
            <p className={`text-slate-600 text-sm md:text-base leading-relaxed ${open || !long ? '' : 'line-clamp-3'}`}>
              <Highlight text={summary} term={term} />
            </p>
            {long && (
              <button onClick={() => setOpen(!open)} className="mt-1 text-xs font-black text-slate-400 hover:text-blue-600 inline-flex items-center gap-1">
                {open ? '收合' : '看完整摘要'} <i className={`ph-bold ${open ? 'ph-caret-up' : 'ph-caret-down'}`}></i>
              </button>
            )}
          </div>
          <div className="pt-4 mt-5 border-t border-slate-100 flex justify-between items-center">
            <a href={item["超連結"]} target="_blank" rel="noopener noreferrer" className="text-sm font-black text-blue-600 flex items-center gap-1.5 hover:text-blue-800 transition-all">
              閱讀原始資料 <i className="ph-bold ph-arrow-square-out text-lg"></i>
            </a>
            <div className="flex items-center gap-3">
              {item.isRecommended && (
                <span className={`text-xs font-black flex items-center gap-1 ${item.score >= 9 ? 'text-red-500' : 'text-amber-600'}`}>
                  <i className={`ph-fill ${item.score >= 9 ? 'ph-fire' : 'ph-star'}`}></i> {item.score} 分
                </span>
              )}
              <span className="text-xs font-bold text-slate-400 mono bg-slate-50 px-2 py-1 rounded-md">{item.displayDate}</span>
            </div>
          </div>
        </article>
      );
    }

    // ── 主 App ────────────────────────────────────────────────────
    function App() {
      const [currentView, setCurrentView] = useState(location.hash === "#focus" ? "focus" : "data");
      const [searchTerm, setSearchTerm] = useState("");
      const [activeTab, setActiveTab] = useState("全部情報");
      const [newsData, setNewsData] = useState([]);
      const [focusHistory, setFocusHistory] = useState([]);
      const [selectedFocus, setSelectedFocus] = useState(null);   // 只用在「歷史戰略回顧」
      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [syncState, setSyncState] = useState("idle");         // idle｜syncing｜failed（有舊資料時才會用到）

      const [showToday, setShowToday] = useState(true);
      const [focusTab, setFocusTab] = useState("current");
      const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);

      const [viewStats, setViewStats] = useState({ today: 0, total: 0 });
      const [showAdmin, setShowAdmin] = useState(false);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [formData, setFormData] = useState({ title: '', link: '', reason: '' });
      const [toast, setToast] = useState(null);
      const [showTop, setShowTop] = useState(false);
      const searchRef = useRef(null);

      const TODAY = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');

      const showToast = (msg, ok) => {
        setToast({ msg, ok });
        setTimeout(() => setToast(null), 3500);
      };

      const applyResult = (result) => {
        const formatted = (result.news || []).map(item => ({
          ...item,
          score: parseInt(item["推薦指數"]) || 0,
          displayDate: (item["執行日期"] || "").toString().replace(/-/g, '.'),
          isRecommended: ["是", "y", "v", "true", "1"].includes(String(item["版主推薦"] || "").toLowerCase().trim())
        }));
        setNewsData(formatted);

        const hist = (result.focus || []).map(d => ({
          title: d.標題,
          date: d.日期,
          videoUrl: d.影片網址,
          keyPoints: d.重點整理,
          what: d.WHAT,
          soWhat: d.SOWHAT,
          nowWhat: d.NOWWHAT,
        })).reverse();
        setFocusHistory(hist);
        // 背景更新時，正在看的那篇歷史焦點不要被換掉
        setSelectedFocus(prev => prev ? (hist.find(h => h.title === prev.title && h.date === prev.date) || null) : null);

        if (result.views) setViewStats(result.views);
      };

      useEffect(() => {
        const cached = readCache();
        if (cached && cached.data) {
          applyResult(cached.data);
          setIsLoading(false);
          setSyncState("syncing");
        }
        jsonp({})
          .then((result) => {
            applyResult(result);
            writeCache(result);
            setIsLoading(false);
            setSyncState("idle");
          })
          .catch(() => {
            if (cached && cached.data) setSyncState("failed");
            else setLoadError(true);
            setIsLoading(false);
          });
      }, []);

      // 網址帶 #focus 直接開戰略焦點（信件按鈕可以連過來）
      useEffect(() => {
        const want = currentView === "focus" ? "#focus" : "";
        if (location.hash !== want) history.replaceState(null, "", location.pathname + location.search + want);
      }, [currentView]);

      useEffect(() => {
        const onScroll = () => setShowTop(window.scrollY > 700);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      // 投稿視窗：Esc 關閉、背景不捲動
      useEffect(() => {
        if (!isModalOpen) return;
        const onKey = (e) => { if (e.key === "Escape") setIsModalOpen(false); };
        document.addEventListener("keydown", onKey);
        document.body.style.overflow = "hidden";
        return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
      }, [isModalOpen]);

      // 換篩選條件就從頭顯示
      useEffect(() => { setVisibleCount(PAGE_SIZE); }, [searchTerm, activeTab, showToday]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        jsonp({ action: 'contribute', title: formData.title, link: formData.link, reason: formData.reason })
          .then((res) => {
            setIsSubmitting(false);
            if (res && res.success) {
              showToast('感謝分享！已送給版主審核。', true);
              setFormData({ title: '', link: '', reason: '' });
              setIsModalOpen(false);
            } else {
              showToast('送出失敗，請稍後再試或聯繫版主。', false);
            }
          })
          .catch(() => { setIsSubmitting(false); showToast('送出失敗，請稍後再試或聯繫版主。', false); });
      };

      // 今天還沒有資料（爬蟲還沒跑完）就顯示最近一天
      const hasToday = useMemo(() => newsData.some(i => i.displayDate === TODAY), [newsData, TODAY]);
      const viewDate = useMemo(() => {
        if (hasToday) return TODAY;
        let best = "", bestKey = 0;
        newsData.forEach(i => { const k = dateKey(i.displayDate); if (k > bestKey) { bestKey = k; best = i.displayDate; } });
        return best || TODAY;
      }, [newsData, hasToday, TODAY]);
      const dayLabel = hasToday ? "今日" : `${shortDate(viewDate)} `;

      const dayData = useMemo(() => newsData.filter(i => i.displayDate === viewDate), [newsData, viewDate]);

      const stats = useMemo(() => ({
        total: dayData.length,
        tools: dayData.filter(i => i["資訊類別"] === "生產力工具").length,
        policy: dayData.filter(i => i["資訊類別"] === "政策與產業").length,
        teaching: dayData.filter(i => i["資訊類別"] === "科技與教學").length,
        school: dayData.filter(i => i["資訊類別"] === "學校現場").length,
      }), [dayData]);

      const term = searchTerm.trim();

      // 先套「日期＋搜尋」，分類按鈕上的數字就從這裡算
      const scoped = useMemo(() => {
        const q = term.toLowerCase();
        return newsData.filter(item => {
          if (showToday && item.displayDate !== viewDate) return false;
          if (!q) return true;
          return [item["標題"], item["摘要"], item["出處"]].some(v => String(v || "").toLowerCase().includes(q));
        });
      }, [newsData, showToday, viewDate, term]);

      const tabCounts = useMemo(() => {
        const c = { "全部情報": scoped.length };
        CATEGORIES.forEach(cat => { c[cat] = scoped.filter(i => i["資訊類別"] === cat).length; });
        return c;
      }, [scoped]);

      const filteredData = useMemo(() => {
        const result = scoped.filter(item => activeTab === "全部情報" || item["資訊類別"] === activeTab);
        result.sort((a, b) => {
          const dA = dateKey(a.displayDate), dB = dateKey(b.displayDate);
          // 「全部歷史」＝時間軸，純粹依日期新到舊；同一天才用分數決定先後
          if (!showToday) {
            if (dB !== dA) return dB - dA;
            return b.score - a.score;
          }
          // 「今日情報」：推薦 → 分數 → 日期
          if (a.isRecommended !== b.isRecommended) return a.isRecommended ? -1 : 1;
          if (b.score !== a.score) return b.score - a.score;
          return dB - dA;
        });
        return result;
      }, [scoped, activeTab, showToday]);

      const pickStat = (tab) => { setShowToday(true); setActiveTab(tab); };

      const openFocusView = () => {
        setCurrentView("focus");
        setFocusTab("current");
        setSelectedFocus(null);
        window.scrollTo({ top: 0 });
      };

      if (isLoading) return <SkeletonScreen />;

      if (loadError) return (

          <div className="bg-white rounded-[2rem] border-2 border-dashed border-slate-200 p-12">

                      onChange={e => setFormData({...formData, title: e.target.value})}
                      type="text"
                      placeholder="例如：台大教授揭開 AI 駕馭工程..."
                      className="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 focus:outline-none font-bold text-slate-800 transition-colors"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-black text-slate-700 mb-2">超連結 URL <span className="text-red-500">*</span></label>
                    <input
                      required
                      value={formData.link}
                      onChange={e => setFormData({...formData, link: e.target.value})}
                      type="url"
                      placeholder="https://..."
                      className="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 focus:outline-none font-bold text-slate-800 transition-colors"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-black text-slate-700 mb-2">摘要內容</label>
                    <textarea
                      rows="3"
                      value={formData.reason}
                      onChange={e => setFormData({...formData, reason: e.target.value})}
                      placeholder="請簡單說明這篇文章為什麼值得讀者參考..."
                      className="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 focus:outline-none font-bold text-slate-800 transition-colors resize-none"
                    ></textarea>
                  </div>
                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className={`w-full py-4 rounded-2xl font-black text-lg shadow-lg transition-all flex justify-center items-center gap-2 ${isSubmitting ? 'bg-slate-400 text-slate-100 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}
                    >
                      {isSubmitting ? (
                        <><i className="ph-bold ph-spinner-gap animate-spin text-xl"></i> 傳送中...</>
                      ) : '確認送出推薦'}
                    </button>
                    <p className="text-center text-xs text-slate-400 mt-4 font-bold tracking-tight">送出後將由版主人工審核後發布</p>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
